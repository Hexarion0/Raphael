name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
          python -m pip install -e ".[dev]"
      - name: Lint and test
        run: |
          ruff check src tests
          pytest
          python -m pip check
          bash -n setup.sh scripts/install_raphael_command.sh scripts/launch_raphael_gpu.sh
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/raphael-*.whl
      - name: Smoke test installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m raphael --help
          raphael --version
          python -c 'from importlib.resources import files; assert files("raphael").joinpath("web_assets/index.html").is_file()'
